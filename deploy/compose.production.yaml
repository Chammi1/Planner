name: sotaplanner

x-app-env: &app-env
  DATABASE_URL: postgresql://planner:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@db:5432/planner
  BOT_TOKEN: ${BOT_TOKEN:?Set BOT_TOKEN}
  OWNER_TELEGRAM_ID: ${OWNER_TELEGRAM_ID:?Set OWNER_TELEGRAM_ID}
  PUBLIC_URL: ${PUBLIC_URL:-https://bot.sotaholder.ru:8443}
  APP_TIMEZONE: ${APP_TIMEZONE:-Asia/Yekaterinburg}

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped

    environment:
      POSTGRES_DB: planner
      POSTGRES_USER: planner
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}

    volumes:
      - pgdata:/var/lib/postgresql/data

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U planner -d planner
      interval: 5s
      timeout: 3s
      retries: 20

    logging: *logging

  api:
    image: ${API_IMAGE:?Set API_IMAGE in deploy/release.env}
    restart: unless-stopped

    environment: *app-env

    depends_on:
      db:
        condition: service_healthy

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

    security_opt:
      - no-new-privileges:true

    read_only: true
    tmpfs:
      - /tmp

    logging: *logging

  web:
    image: ${WEB_IMAGE:?Set WEB_IMAGE in deploy/release.env}
    restart: unless-stopped

    environment:
      DOMAIN: ${DOMAIN:-bot.sotaholder.ru}
      ACME_EMAIL: ${ACME_EMAIL:?Set ACME_EMAIL}
      PUBLIC_URL: ${PUBLIC_URL:-https://bot.sotaholder.ru:8443}

    ports:
      - "80:80/tcp"
      - "8443:443/tcp"

    volumes:
      - caddy_data:/data
      - caddy_config:/config

    depends_on:
      api:
        condition: service_healthy

    logging: *logging

  bot:
    profiles:
      - bot

    image: ${API_IMAGE:?Set API_IMAGE in deploy/release.env}
    command:
      - python
      - -m
      - app.bot

    restart: "no"

    environment: *app-env

    depends_on:
      db:
        condition: service_healthy

    security_opt:
      - no-new-privileges:true

    read_only: true
    tmpfs:
      - /tmp

    logging: *logging

volumes:
  pgdata:
  caddy_data:
  caddy_config: