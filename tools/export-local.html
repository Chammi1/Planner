<!doctype html><html lang="ru"><meta charset="utf-8"><title>Экспорт локального планировщика</title><body><h1>Экспорт старых данных</h1><p>Если старый планировщик открыт как локальный файл, надёжнее использовать его кнопку «Экспорт JSON» после сохранения копии старого HTML. Для этой утилиты требуется то же хранилище (origin), что у старой страницы; для file:// оно может отличаться.</p><button id="export">Экспортировать my-tasks-v1</button><p id="status"></p><script>document.querySelector('#export').onclick=()=>{try{const raw=localStorage.getItem('my-tasks-v1');if(!raw)throw Error('Данные в этом хранилище не найдены. Используй консоль старой страницы по инструкции.');const value=JSON.parse(raw);if(!Array.isArray(value.tasks))throw Error('Неизвестный формат');const url=URL.createObjectURL(new Blob([raw],{type:'application/json'})),a=document.createElement('a');a.href=url;a.download='planner-local.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}catch(e){document.querySelector('#status').textContent=e.message;}};</script></body></html>
