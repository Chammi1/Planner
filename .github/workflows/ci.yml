name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Code checks and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check Python syntax
        run: python -m compileall -q backend

      - name: Run unit tests
        working-directory: backend
        run: python -m unittest discover -s tests -v

      - name: Check frontend JavaScript
        run: python scripts/check_frontend.py

      - name: Check shell scripts
        run: |
          for file in scripts/*.sh; do
            sh -n "$file"
          done

      - name: Validate Docker Compose configuration
        env:
          DOMAIN: bot.sotaholder.ru
          PUBLIC_URL: https://bot.sotaholder.ru:8443
          ACME_EMAIL: ci@example.com
          BOT_TOKEN: "123456:ci-test-token-not-real"
          OWNER_TELEGRAM_ID: "123456789"
          APP_TIMEZONE: Asia/Yekaterinburg
          POSTGRES_PASSWORD: ci-test-password-not-real
        run: docker compose config --quiet

      - name: Validate production Compose configuration
        env:
          DOMAIN: bot.sotaholder.ru
          PUBLIC_URL: https://bot.sotaholder.ru:8443
          ACME_EMAIL: ci@example.com
          BOT_TOKEN: "123456:ci-test-token-not-real"
          OWNER_TELEGRAM_ID: "123456789"
          APP_TIMEZONE: Asia/Yekaterinburg
          POSTGRES_PASSWORD: ci-test-password-not-real
        run: |
          docker compose \
            --project-directory . \
            --env-file deploy/release.env \
            -f deploy/compose.production.yaml \
            config --quiet

  docker-build:
    name: Build application image
    needs: [checks, integration]
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Build backend and bot image
        run: docker build --tag sotaplanner-api:ci ./backend

      - name: Build web image
        run: |
          docker build \
            --file deploy/Dockerfile.web \
            --tag sotaplanner-web:ci \
            .

  integration:
    name: API and PostgreSQL integration tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: planner_test
          POSTGRES_USER: planner
          POSTGRES_PASSWORD: test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U planner -d planner_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    env:
      RUN_INTEGRATION: "1"
      DATABASE_URL: postgresql://planner:test-password@127.0.0.1:5432/planner_test
      BOT_TOKEN: "123456:ci-test-token-not-real"
      OWNER_TELEGRAM_ID: "123456789"
      APP_TIMEZONE: Asia/Yekaterinburg
      PUBLIC_URL: https://example.com

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r backend/requirements.txt

      - name: Run API integration tests
        working-directory: backend
        run: python -m unittest discover -s tests -p "test_api.py" -v

  publish:
    name: Publish ${{ matrix.image }} to GHCR
    needs: docker-build

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    runs-on: ubuntu-24.04
    timeout-minutes: 20

    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - image: planner-api
            context: ./backend
            dockerfile: ./backend/Dockerfile

          - image: planner-web
            context: .
            dockerfile: ./deploy/Dockerfile.web

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Prepare image name
        id: image
        shell: bash
        env:
          OWNER: ${{ github.repository_owner }}
          IMAGE: ${{ matrix.image }}
        run: |
          OWNER_LOWER="${OWNER,,}"
          echo "name=ghcr.io/${OWNER_LOWER}/${IMAGE}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

      - name: Write image reference to summary
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          DIGEST: ${{ steps.build.outputs.digest }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          {
            echo "### Published image"
            echo
            echo "Tag: \`${IMAGE}:sha-${COMMIT_SHA}\`"
            echo
            echo "Digest reference: \`${IMAGE}@${DIGEST}\`"
          } >> "$GITHUB_STEP_SUMMARY"